# Start:   docker compose up -d --build
# Admin:   docker compose exec app node server/src/cli.ts create-admin
# Backup:  docker compose exec app node server/src/cli.ts backup /data/backups
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Nur lokal erreichbar – nach außen geht es ausschließlich über Caddy (HTTPS)
    ports:
      - "127.0.0.1:3000:3000"

  # Caddy besorgt automatisch ein HTTPS-Zertifikat (Let's Encrypt).
  # Voraussetzung: Die Domain zeigt per DNS auf diesen Server, Ports 80/443 sind offen.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
